; PHP defaults to a 2 MB upload limit, which rejects typical phone photos before
; the application can validate them. The rider portal accepts proof photos up to
; 5 MB, so keep the server limits comfortably above that.
upload_max_filesize = 6M
post_max_size = 10M
max_file_uploads = 10
max_execution_time = 120
memory_limit = 256M
